version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # patch/minor bumps land as one combined PR per week instead of dozens of individual ones
      minor-and-patch:
        update-types: ["minor", "patch"]
    # major bumps (NestJS suite, Next.js, TypeScript, BullMQ, ioredis, openai, etc.) need coordinated,
    # deliberate testing rather than a weekly drive-by merge — bump these on purpose instead
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/apps/web"
      - "/apps/worker"
    schedule:
      interval: "weekly"
    # same reasoning as npm above — a Node major (e.g. 20 -> 26) deserves its own deliberate test pass
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
